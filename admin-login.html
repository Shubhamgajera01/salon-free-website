<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinity | Staff Login</title>
<link rel="stylesheet" href="css/admin.css">
<style>
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:min(440px,100%);padding:34px;border-radius:24px;background:#fff;box-shadow:0 20px 60px #0001}
.auth-card h1{margin:0 0 8px}.auth-card p{opacity:.7}.auth-card label{display:block;margin:18px 0 7px;font-weight:700}
.auth-card input{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.auth-card button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;cursor:pointer;font-weight:800}
#error{margin-top:15px;color:#b42318}.brand{font-weight:900}
</style>
</head>
<body>
<div class="auth-wrap"><form class="auth-card" id="loginForm">
<div class="brand">∞ INFINITY THE FAMILY SALON</div>
<h1>Staff Login</h1>
<p>Secure owner/staff access to appointments.</p>
<label>Email</label><input id="email" type="email" autocomplete="username" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
<div id="error"></div>
</form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const error=document.getElementById("error"); error.textContent="";
 try{
   const r=await InfinityAuth.login(email.value.trim(),password.value);
   if(r.error) throw r.error;
   const profile=await InfinityAuth.getProfile(r.data.user.id);
   if(!profile){await InfinityAuth.logout();throw new Error("This account is not an active salon staff account.");}
   location.href="admin.html";
 }catch(err){error.textContent=err.message||"Login failed."}
});
</script>
</body></html>
